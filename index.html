<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="九九ダンジョン">
<title>九九ダンジョン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  --bg:#000; --ink:#fff; --dim:#9aa0b8; --gold:#ffd23f; --red:#ff5a4a; --green:#6fd66a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* レトロRPGの画面なので、明るいテーマでも暗いテーマでも同じ配色にする */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#fff; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#fff; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,monospace;
  font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit;background:var(--bg)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;padding:10px 12px 12px;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}
.screen.on{display:flex}
.scroll{overflow-y:auto}
.win{background:var(--bg);border:3px solid var(--ink);border-radius:8px;padding:10px 12px}
.cmd{border:3px solid var(--ink);border-radius:8px;padding:10px 8px;text-align:left}
.cmd:active{background:var(--ink);color:var(--bg)}
.cmd:disabled{border-color:var(--dim);color:var(--dim);cursor:default}
.wide{display:block;width:100%;margin-bottom:6px}
.small{font-size:15px;color:var(--dim)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.grow{flex:1;min-height:0}
.pre{white-space:pre-line}

/* タイトル */
h1{margin:6px 0 4px;text-align:center;font-weight:400;font-size:clamp(34px,11vw,52px);letter-spacing:.08em;color:var(--gold);text-shadow:3px 3px 0 #8a4b00}
.center{text-align:center}
.slot{display:flex;gap:8px;margin-top:8px}
.slot .cmd{flex:1}
.cmd.locked{border-color:var(--dim);color:var(--dim)}
.fl.rest{border-color:#444;opacity:.55}
.slot .del{border:3px solid var(--dim);color:var(--dim);border-radius:8px;padding:0 10px;font-size:15px}
.name{width:100%;border:3px solid var(--ink);border-radius:8px;padding:10px;margin:8px 0;font-size:24px}

/* きょてん */
.hero{display:flex;gap:12px;align-items:center}
.hero svg{height:72px;flex:none}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pk{border:2px solid var(--dim);border-radius:6px;padding:6px 2px;text-align:center;font-size:12px;line-height:1.25;min-width:0}
.pk svg{height:46px;display:block;margin:0 auto 3px}
.pk.on{border:3px solid var(--gold);color:var(--gold)}
.pk:disabled{color:var(--dim);cursor:default}
.pk:disabled svg{filter:brightness(.2)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swb{aspect-ratio:1;border:3px solid var(--dim);border-radius:8px;min-width:0}
.swb.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
select.name{font-size:18px;margin:4px 0 6px}
.card{border:2px solid var(--dim);border-radius:6px;padding:8px;margin-bottom:8px}
.code{width:100%;border:2px solid var(--dim);border-radius:6px;padding:8px;font-size:16px;letter-spacing:.05em;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fl{border:3px solid var(--ink);border-radius:8px;padding:6px 2px 8px;text-align:center;line-height:1.3}
.fl svg{height:44px;display:block;margin:0 auto 2px}
.fl:active{background:#222}
.fl.done,.cmd.done{border-color:var(--gold)}
.status{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.bar{display:flex;gap:8px}
.bar .cmd{flex:1;text-align:center;padding:8px 4px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .cmd{text-align:center;padding:8px 4px}

/* そうび・ずかん・リスト */
.list{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.item{display:flex;justify-content:space-between;gap:8px;border:2px solid var(--dim);border-radius:6px;padding:6px 8px;text-align:left}
.item.on{border-color:var(--gold);color:var(--gold)}
.sw{display:inline-block;width:.75em;height:.75em;margin-right:.35em;border:1px solid var(--ink)}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.zt{border:2px solid var(--dim);border-radius:6px;padding:6px 2px;text-align:center;font-size:13px;line-height:1.3;min-width:0}
.zt.got{border-color:var(--ink)}
.zt svg{height:40px;display:block;margin:0 auto 2px}
.row{border-bottom:1px solid #333;padding:6px 0}
h2{font-size:18px;font-weight:400;margin:12px 0 4px;color:var(--gold)}

/* たたかい */
.arena{
  --brick:#2b2540; --brick2:#1c1830; --floor:#141020;
  flex:1 1 0;min-height:34vh;border:3px solid var(--ink);border-radius:8px;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6%;
  background:
    linear-gradient(transparent 0 78%,var(--floor) 78%),
    repeating-linear-gradient(0deg,transparent 0 22px,#000 22px 24px),
    repeating-linear-gradient(90deg,var(--brick) 0 46px,var(--brick2) 46px 48px);
}
.arena .where{position:absolute;top:6px;left:10px;font-size:15px;color:var(--dim);z-index:1}
.arena .mhp{position:absolute;top:28px;right:10px;width:50%;z-index:1;text-align:right;font-size:15px;line-height:1.3;text-shadow:2px 2px 0 #000}
.mbar{height:16px;border:2px solid var(--ink);border-radius:4px;background:#222;overflow:hidden}
.mbar i{display:block;height:100%;width:100%;background:var(--red);transition:width .45s}
#mon{display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;transform-origin:50% 100%}
#mon svg{max-width:96%;transform-origin:50% 100%;overflow:visible}
svg image{image-rendering:pixelated;image-rendering:crisp-edges}
/* まものの うごき：まっている とき（しゅるいごと） */
#mon.mv-float{animation:mvFloat 3.2s ease-in-out infinite}
#mon.mv-flap{animation:mvFlap .9s ease-in-out infinite}
#mon.mv-rattle{animation:mvRattle 1.1s steps(2) infinite}
#mon.mv-breathe{animation:mvBreathe 2.4s ease-in-out infinite}
#mon.mv-stomp{animation:mvStomp 2.4s ease-in infinite}
#mon.mv-hop{animation:mvHop 1.3s ease-out infinite}
#mon.rage{animation-duration:.8s}
@keyframes mvFloat{0%,100%{transform:translate(-7px,0)}25%{transform:translate(0,-9px)}50%{transform:translate(7px,0)}75%{transform:translate(0,-5px)}}
@keyframes mvFlap{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes mvRattle{0%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes mvBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes mvStomp{0%,62%,100%{transform:translateY(0) scale(1,1)}76%{transform:translateY(-10px) scale(.98,1.03)}88%{transform:translateY(0) scale(1.05,.93)}}
@keyframes mvHop{0%,55%,100%{transform:translateY(0)}75%{transform:translateY(-14px)}}
/* パーツ（つばさ・つめ など）と まばたき */
.pg{transform-box:fill-box;transform-origin:50% 60%}
#mon .pg{animation:pgFlap 1.1s ease-in-out infinite}
#mon.mv-flap .pg{animation-duration:.3s}
@keyframes pgFlap{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.07)}}
.bl{opacity:0}
#mon .bl,#heroB .bl{animation:blinkEye 4.4s steps(1) infinite}
@keyframes blinkEye{0%{opacity:0}94%{opacity:1}97%{opacity:0}}
/* ピンチ：ふらふら。ボスは あかく なって はやくなる */
#mon.pinch svg{animation:wobble .55s ease-in-out infinite}
#mon.rage svg{filter:drop-shadow(0 0 12px #ff2020) saturate(1.7) brightness(1.1)}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* 「うごき すくなめ」の せってい */
.calm #mon,.calm #mon .pg,.calm #mon .bl,.calm #heroB .bl,.calm #mon.pinch svg{animation:none}
#fx .shot{position:absolute;left:50%;top:45%;width:16%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 14px 6px currentColor;background:#fff;animation:shot .26s ease-in forwards}
@keyframes shot{0%{transform:translate(-50%,-50%) scale(.4)}100%{transform:translate(-330%,140%) scale(1.5)}}
#battle{overflow-y:auto;gap:8px}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:6px;z-index:3}
.acts .cmd{padding:3px 8px;font-size:14px;border-width:2px;background:rgba(0,0,0,.72);color:#fff}
.acts .cmd:disabled{color:var(--dim)}
#warn{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:44px;color:var(--red);text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000;z-index:2;pointer-events:none;display:none}
#warn.on{display:block;animation:warn 1.1s both}
.hpbar i.low{animation:pulse .7s steps(2) infinite}
#mon.boss svg{filter:drop-shadow(0 0 10px #ff3030)}
#mon.rare svg{filter:drop-shadow(0 0 10px #ffe066) brightness(1.35) saturate(1.6)}
#party{position:absolute;left:8px;bottom:4px;height:32%;display:flex;align-items:flex-end;gap:6px;z-index:1;pointer-events:none}
#heroB{height:100%}
#heroB svg{height:100%;display:block}
#heroB.hop{animation:hop .35s}
#pal{height:60%}
#pal svg{height:100%;display:block}
@keyframes hop{0%,100%{transform:translate(0)}40%{transform:translate(45%,-28%)}}
#pal.used{opacity:.3}
.msg{height:6.2em;overflow-y:auto;white-space:pre-line;font-size:16px;line-height:1.4;padding:8px 12px}
.q{text-align:center;font-size:clamp(32px,10vw,46px);line-height:1.2;letter-spacing:.04em;padding:4px 8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers.pad{grid-template-columns:repeat(4,1fr);gap:6px}
.ans{border:3px solid var(--ink);border-radius:8px;padding:7px 0;font-size:clamp(26px,8vw,36px);line-height:1.2}
.pad .ans{padding:6px 0;font-size:24px}
.ans:active{background:var(--ink);color:var(--bg)}
.ans.right{background:var(--green);color:#000;border-color:var(--green)}
.ans.wrong{color:var(--dim);border-color:var(--dim)}
.ans:disabled{cursor:default}
.next{display:none;text-align:center;border-color:var(--gold);color:var(--gold)}
.next.show{display:block}

/* HPバー・コンボ・こうげきエフェクト・にゅうしゅ まど */
.hpbar{flex-basis:100%;height:16px;border:2px solid var(--ink);border-radius:4px;background:#222;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--green);transition:width .35s}
.hpbar i.mid{background:var(--gold)}
.hpbar i.low{background:var(--red)}
#combo{position:absolute;left:10px;top:30px;z-index:1;color:var(--gold);line-height:1.15;text-shadow:2px 2px 0 #000}
#combo b{font-weight:400;font-size:34px}
#combo.bump{animation:bump .3s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
#fx .spark{position:absolute;left:50%;top:50%;height:78%;aspect-ratio:1;transform:translate(-50%,-50%);animation:spark .36s both}
#fx .white{position:absolute;inset:0;background:#fff;animation:wflash .22s both}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);white-space:nowrap;font-size:60px;line-height:1;color:#fff;text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 5px 0 #000;animation:rise 1s .18s both}
.dmg.crit{color:var(--gold);font-size:78px}
.dmg.hurt,.dmg.guard{animation-delay:0s}
.dmg.hurt{color:var(--red);top:52%}
.dmg.guard{color:#7fd0ff;top:56%;font-size:34px}
#flash{position:fixed;inset:0;background:#ff2a2a;opacity:0;pointer-events:none;z-index:5}
#flash.on{animation:flash .35s}
.pop{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:20px}
.pop.show{display:flex}
.popwin{width:100%;max-width:340px;text-align:center;border-color:var(--gold);animation:bump .3s}
.popwin svg{height:72px;display:block;margin:10px auto}
.popwin .nm{font-size:24px;margin:4px 0}
.popwin .cmd{display:block;width:100%;margin-top:12px;text-align:center;border-color:var(--gold);color:var(--gold)}
/* ふたりで たいせん：1だいを はさんで むかいあう。うえの ひとは さかさま */
#versus{gap:6px}
.vs{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.vs.p2{transform:rotate(180deg)}
.vsHead{display:flex;justify-content:space-between;align-items:center}
.vsHead .hero svg{height:40px}
.vsScore{font-size:26px;color:var(--gold)}
.vs .q{font-size:clamp(28px,9vw,42px)}
.vs.p1 .win{border-color:#5aa9ff}
.vs.p2 .win{border-color:#ff7a8a}
.vsMid{display:flex;align-items:center;gap:8px}
.vsMid .cmd{padding:4px 10px;flex:none}
.tug{flex:1;height:18px;border:2px solid var(--ink);border-radius:4px;background:#ff7a8a;overflow:hidden}
.tug i{display:block;height:100%;width:50%;background:#5aa9ff;transition:width .3s}
#ghost{position:absolute;right:8px;top:30px;z-index:1;display:none;text-align:right;font-size:15px;line-height:1.3;text-shadow:2px 2px 0 #000}
#ghost.on{display:block}
#ghost svg{height:44px;display:block;margin-left:auto;opacity:.55}
#ghost b{font-weight:400;font-size:24px;color:var(--gold)}
/* すばやさゲージ と ヒントの ひょう */
.spd{height:6px;margin:-4px 2px 0;background:#222;border-radius:3px;overflow:hidden;visibility:hidden}
.spd.run{visibility:visible}
.spd i{display:block;height:100%;background:var(--gold);transform-origin:left center}
.spd.run i{animation:spdrun linear forwards}
.spd.stop i{animation-play-state:paused}
@keyframes spdrun{to{transform:scaleX(0)}}
.tbl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;margin:10px 0;font-size:17px;text-align:left;white-space:nowrap}
/* ゲームオーバー */
.over{background:#000;flex-direction:column;gap:12px;text-align:center;overflow-y:auto;animation:fadein 1.2s both}
.over .go{font-size:clamp(40px,13vw,64px);line-height:1.2;color:var(--red);letter-spacing:.08em;text-shadow:3px 3px 0 #5a0000;animation:godrop 1.1s .3s both}
.over svg{height:64px;transform:rotate(90deg);filter:grayscale(1) brightness(.7);margin:4px auto}
.over .cmd{width:100%;max-width:340px;text-align:center}
.over .again{border-color:var(--gold);color:var(--gold)}
.over .miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.over .miss span{border:2px solid var(--dim);border-radius:6px;padding:2px 8px}
.over .late{animation:fadein .6s 1.5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes godrop{0%{transform:translateY(-60px) scale(1.3);opacity:0}60%{transform:translateY(6px) scale(1);opacity:1}100%{transform:translateY(0)}}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.5) rotate(25deg);opacity:0}}
@keyframes rise{0%{transform:translate(-50%,24px) scale(.3);opacity:0}18%{transform:translate(-50%,-10px) scale(1.35);opacity:1}32%{transform:translate(-50%,0) scale(1)}75%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes shakeHit{0%{transform:translate(0);filter:brightness(5) saturate(0)}12%{transform:translate(-18px,5px) rotate(-6deg);filter:brightness(5) saturate(0)}26%{transform:translate(16px,-4px) rotate(5deg);filter:brightness(1.4)}40%{transform:translate(-13px,3px) rotate(-4deg)}54%{transform:translate(10px,-2px) rotate(3deg)}68%{transform:translate(-7px,0) rotate(-2deg)}84%{transform:translate(4px,0)}100%{transform:translate(0)}}
@keyframes flash{0%{opacity:0}30%{opacity:.4}100%{opacity:0}}
@keyframes blink{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(10px)}}
@keyframes quake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}
#mon.is-hit svg{animation:shakeHit .6s both}
#mon.is-down svg{animation:fade .7s forwards}
#mon.is-down-pop svg{animation:diePop .5s forwards}
#mon.is-down-shrink svg{animation:dieShrink .7s forwards}
#mon.is-down-boss svg{animation:dieBoss 1.5s forwards}
#mon.is-in svg{animation:appear .5s both}
#mon.is-in-boss svg{animation:bossDrop .75s both}
#mon.is-atk-lunge svg{animation:lunge .5s both}
#mon.is-atk-swoop svg{animation:swoop .55s both}
#mon.is-atk-slam svg{animation:slam .55s both}
#mon.is-atk-shoot svg{animation:recoil .5s both}
@keyframes diePop{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.35);filter:brightness(4);opacity:1}100%{transform:scale(1.9);filter:brightness(6);opacity:0}}
@keyframes dieShrink{0%{transform:scale(1) rotate(0)}100%{transform:scale(0) rotate(540deg);opacity:0}}
@keyframes dieBoss{0%,12%,24%,36%,48%{opacity:1;filter:brightness(5)}6%,18%,30%,42%{opacity:.25;filter:brightness(1)}55%{opacity:1;transform:scale(1,1)}100%{opacity:0;transform:scale(1.25,0)}}
@keyframes bossDrop{0%{transform:translateY(-130%);filter:brightness(0)}55%{transform:translateY(0) scale(1.12,.84);filter:brightness(0)}75%{transform:translateY(-6%) scale(.97,1.04)}100%{transform:translateY(0)}}
@keyframes swoop{0%{transform:translate(0,0)}25%{transform:translate(18%,-22%) rotate(10deg)}55%{transform:translate(-26%,24%) rotate(-16deg) scale(1.3)}100%{transform:translate(0,0)}}
@keyframes slam{0%{transform:translateY(0)}35%{transform:translateY(-34%) scale(.95,1.06)}60%{transform:translateY(12%) scale(1.3,.8)}100%{transform:translateY(0)}}
@keyframes recoil{0%{transform:scale(1)}20%{transform:scale(1.12,1.1)}45%{transform:scale(.9) translateY(-5%)}100%{transform:scale(1)}}
.app.critq{animation:quake .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes appear{0%{transform:scale(.2);filter:brightness(0);opacity:0}60%{transform:scale(1.12);filter:brightness(0);opacity:1}100%{transform:scale(1)}}
@keyframes lunge{0%{transform:scale(1)}18%{transform:scale(.9) translateY(-6%)}45%{transform:scale(1.45) translateY(10%)}60%{transform:scale(1.4) translateY(8%)}100%{transform:scale(1)}}
@keyframes wflash{0%{opacity:.55}100%{opacity:0}}
@keyframes warn{0%{transform:scale(2.2);opacity:0}15%{transform:scale(1);opacity:1}30%,60%{opacity:.3}45%,80%{opacity:1}100%{opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.quake{animation:quake .3s}
@media (prefers-reduced-motion: reduce){#mon,#mon .pg,#mon .bl,#heroB .bl,#mon svg,#fx .shot,#heroB.hop,.quake,#combo.bump,#fx .spark,#fx .white,.dmg,.dmg.hurt,.over,.over .go,.over .late,#flash.on,.popwin,.app.critq,.hpbar i.low,#warn.on{animation:none}#fx .spark,#fx .white,#fx .shot{display:none}#mon[class*=is-down] svg{opacity:.15}}

/* ===== iPad：がめんが ひろい とき ===== */
@media (min-width:700px) and (min-height:560px){
  body{font-size:22px}
  .app{max-width:1100px;padding:16px 24px 20px}
  .screen{gap:14px}
  .small{font-size:17px}
  .cmd{padding:14px 14px}
  h1{font-size:76px;margin-top:10px}
  h2{font-size:22px;margin:16px 0 6px}
  #title{align-items:center}
  #title>*{width:100%;max-width:640px}
  .slot .del{font-size:17px;padding:0 16px}
  .hero svg{height:100px}
  .grid{gap:12px}
  .fl{padding:10px 4px 12px}
  .fl svg{height:70px}

  function recFloors(){
    var r={},f,d,b;
    for(f=1;f<=12;f++)if(!hero.cleared[f]){r[f]=1;break}
    var worst=0,wa=.9;
    for(d=1;d<=9;d++){var c=0,w=0;for(b=1;b<=9;b++){var x=hero.st[d+'x'+b];if(x){c+=x[0];w+=x[1]}}

    if(worst)r[worst]=1;
    return r;
  }

  function lvMult(id){

    var a=farmMult(id),b=lvMult(id),m=Math.min(a,b);

  function cardOf(h){

  function b36(n,len){n=Math.max(0,Math.min(Math.pow(36,len)-1,Math.floor(n)));var t=n.toString(36);while(t.length<len)t='0'+t;return t}

    var nm=Array.from(c.name).slice(0,6),t=b36(nm.length,1);
    nm.forEach(function(ch){var k=ch.codePointAt(0);t+=b36(k>46655?63:k,3)});
    t+=b36(c.lv,2)+b36(c.best,2)+b36(c.zukan,2)+b36(c.items,2)+b36(c.title+1,2)+b36(c.color,1)+b36(c.phrase,1)+b36(c.fav+1,2)+b36(c.mh,1)+b36(c.mw,1)+b36(c.ms,1)+b36(c.skin||0,1)+b36(c.kh||0,1)+b36(c.kw==null?1:c.kw,1)+b36(c.ks==null?2:c.ks,1)+b36(c.wk||0,2)+b36(c.wc||0,2)+'2'+b36(c.skin||0,2);

  function decode(str){
    var t=String(str).toLowerCase().replace(/[^0-9a-z]/g,''),n=parseInt(t[0],36);
    if(!(n>=1&&n<=6)||(t.length!==1+3*n+18&&t.length!==1+3*n+19&&t.length!==1+3*n+22&&t.length!==1+3*n+26&&t.length!==1+3*n+27&&t.length!==1+3*n+29)||sum36(t.slice(0,-1))!==t.slice(-1))return null;
    var i=1,rd=function(len){var v=parseInt(t.substr(i,len),36);i+=len;return v},name='';
    for(var k=0;k<n;k++)name+=String.fromCodePoint(rd(3));

  /* ---- ゴースト たいせん ----

  var ghostSet=0;
  function ghostCode(h,set){
    var g=h.ghosts[set];if(!g||!g.d.length)return '';
    var t='g'+b36(set,1)+b36(g.d.length,2)+g.d.map(function(x){return b36(x,1)}).join('')+encode(cardOf(h)).replace(/-/g,'').toLowerCase();
    return (t+sum36(t)).toUpperCase().match(/.{1,4}/g).join('-');
  }
  function decodeGhost(str){
    var t=String(str).toLowerCase().replace(/[^0-9a-z]/g,'');
    if(t[0]!=='g'||t.length<25||sum36(t.slice(0,-1))!==t.slice(-1))return null;
    var set=parseInt(t[1],36),n=parseInt(t.substr(2,2),36);
    if(!(set<VS_SETS.length)||!(n>=1)||t.length<4+n+20)return null;
    var card=decode(t.slice(4+n,-1));if(!card)return null;
    var acc=0,times=[];
    for(var i=0;i<n;i++){var x=parseInt(t[4+i],36);if(isNaN(x))return null;acc+=x*250;times.push(acc)}
    return {set:set,ghost:{name:card.name,look:card,times:times}};
  }

    if(!cand.length)return null;
    var it=cand[rnd(cand.length)];
    if(G.rare)cand.forEach(function(c){if(iRank(c)>iRank(it))it=c});
    return {id:it,auto:giveItem(it)};
  }
  /* じゅんばんに メッセージを だす */
  function seq(steps,done){
    var i=0;(function run(){
      if(i>=steps.length){done();return}
      var s=steps[i++];if(s.fn)s.fn();say(s.t);if(s.s)tune(s.s,s.l||.09);
      if(s.pop)popup(s.pop,run);else later(run,s.w||2000);
    })();
  }
  function answer(v,btn){
    if(!G.open)return;G.open=false;
    var a=G.cur[0],b=G.cur[1],ans=a*b,target=G.rev||G.div?b:ans,k=key(G.cur),box=$('mon'),ok=v===target;
    [].slice.call($('answers').children).forEach(function(x){x.disabled=true;if(x.dataset.v!==undefined&&+x.dataset.v===target)x.classList.add('right')});
    $('q').textContent=G.div?ans+' ÷ '+a+' ＝ '+b:a+' × '+b+' ＝ '+ans;
    var yomi=hero.cfg.yomi?'\n（'+Y[a-1][b-1]+'）':'';
    var st=hero.st[k]||(hero.st[k]=[0,0]);st[ok?0:1]++;
    var rt=Math.min(30000,Date.now()-G.qt),rs=hero.rt[a]||(hero.rt[a]=[0,0]);rs[0]+=rt;rs[1]++;
    var fast=ok&&hero.cfg.speed&&!G.hinted&&rt<=G.lim&&G.mode!=='time';
    $('spd').classList.add('stop');if(!fast)$('spd').className='spd';
    bumpDaily(ok,a);
    if(G.mode==='time'){timeAnswer(ok,a,b,ans,k,btn);return}
    if(ok){
      hop();
      if(!G.hinted)G.combo++;if(G.combo>hero.rec.combo)hero.rec.combo=G.combo;
      var fixed=false;
      if(hero.nig[k]){hero.nig[k]--;if(hero.nig[k]<=0){delete hero.nig[k];hero.rec.fixed++;fixed=true}}
      var crit=Math.random()*100<eqVal(0);
      var cbo=G.hinted?0:Math.max(0,G.combo-1),dmg=(crit?ans*2:ans)+cbo,sb=0;
      if(fast){sb=Math.max(1,Math.round(ans*.3));dmg+=sb;if(G.rw.m>=1){hero.gold+=2;hero.rec.gold+=2}}
      G.hp-=dmg;drawMhp();status();fx(crit?'crit':'hit',dmg);
      var txt=hero.name+'の こうげき！\n'+(crit?'クリティカル！ ':'')+mname()+'に '+dmg+'の ダメージ！'+(cbo?'（コンボで +'+cbo+'）':'')+(sb?'\nすばやい！ ダメージ +'+sb+(G.rw.m>=1?'、2ゴールド':''):'')+(G.hinted?'\n（ヒントを つかったので コンボは ふえない）':'')+yomi+(fixed?'\nにがてを 1つ こくふくした！':'');
      clearAnim(box);void box.offsetWidth;
      if(G.hp>0){
        box.classList.add('is-hit');hitSfx(crit);gain(1);say(txt);later(ask,hero.cfg.yomi?1900:1500);
      }else{
        var m=G.m,nm=mname(),steps=[],mult=(1+eqVal(3)/100)*(1+Math.min(G.combo,10)*.05)*(G.cheer?1.5:1);
        var exp=Math.round(G.fEq*(G.boss?4:2)*mult*(m.id<0?5:1)),gold=Math.max(1,Math.round(G.fEq*(G.boss?9:3)*(G.rare?5:1)*G.rw.m)),R=Math.min(1.5,G.rw.m);
        if(G.mode==='floor'&&G.id>=1&&G.id<=12){if(hero.farm.d!==today())hero.farm={d:today(),k:{}};hero.farm.k[G.id]=(hero.farm.k[G.id]||0)+1}
        var first=false;
        if(m.id>=0){first=!hero.seen[m.id];hero.seen[m.id]=(hero.seen[m.id]||0)+1}
        if(G.rare)hero.rec.rare++;
        hero.gold+=gold;hero.rec.gold+=gold;
        var mt='';
        if(m.id>=0&&Math.random()<(G.boss?1:.6)*R){
          var tier=Math.min(4,Math.floor((G.fEq-1)/2)),qn=G.boss?2:1;if(tier>0&&Math.random()<.3)tier--;
          if(hero.rec.maou>0&&G.fEq>=9&&Math.random()<.35)tier=5+rnd(3);
          hero.mats[tier]+=qn;mt='\n'+MAT[tier].n+' かけらを '+qn+'こ ひろった！';
        }
        var up=gain(exp),d=m.id>=0?drop():null;
        var join=m.id>=0&&!G.boss&&!hero.pals[m.id]&&Math.random()<.08;
        box.classList.add('is-hit');
        steps.push({t:txt,fn:function(){hitSfx(crit)},w:1200});
        steps.push({t:nm+'を たおした！\nけいけんち '+exp+'と '+gold+'ゴールドを てにいれた！'+mt+(first?'\nまものずかんに きろくした！':''),s:[523,659,784,1047],fn:function(){clearAnim(box);box.classList.remove('pinch','rage');var dt=G.boss?'boss':m.di||'sink';box.classList.add(dt==='sink'?'is-down':'is-down-'+dt);if(dt==='boss'){$('fx').innerHTML='<div class="white"></div>';hitSfx(true)}},w:G.boss?2400:2000});
        if(d)steps.push({t:nm+'は たからばこを おとした！\n「'+iName(d.id)+'」を てにいれた！'+(d.auto?'\nさっそく そうびした！':''),s:[784,988,1175,1568],l:.07,fn:status,pop:{head:'たからばこを てにいれた！',icon:itemIcon(d.id),name:iName(d.id),sub:TYPES[iType(d.id)]+'　'+iEff(d.id,iRank(d.id))+'\n'+(d.auto?'さっそく そうびした！':'「そうび」で つけかえられるよ')}});
        var ds=m.id>=0?dropSkins(hero):[];
        if(ds.length&&Math.random()<(G.rare?.4:G.boss?.12:.04)*R){
          var sk=ds[rnd(ds.length)];hero.skins[sk]=1;
          steps.push({t:nm+'は めずらしい ふくを おとした！\nスキン「'+SKINS[sk].n+'」を てにいれた！',s:[784,988,1175,1568,0,1568],l:.08,pop:{head:'スキンを てにいれた！',icon:skinPic(sk),name:SKINS[sk].n,sub:'プロフィールで きがえられるよ'}});
        }
        if(join)steps.push({t:m.n+'が おきあがり、なかまに なった！',s:[659,784,988,784,1175],l:.09,fn:function(){hero.pals[m.id]=1;if(hero.pal==null)hero.pal=m.id;status()},pop:{head:'なかまが ふえた！',icon:sprite(m),name:esc(m.n),sub:'ぼうけんで 1ど、こうげきから かばってくれる'}});
        if(up)steps.push({t:'レベルが あがった！\n'+hero.name+'は Lv '+hero.lv+'に なった！ HPが かいふくした！',s:[523,523,523,659,784,0,1047],l:.1,fn:function(){G.heroHp=maxHp();status()},pop:{head:'レベルアップ！',icon:heroPic(),name:'Lv '+hero.lv,sub:'HPが ぜんぶ かいふくした！'}});
        G.enc++;G.kills++;
        if(G.mode==='endless'&&G.kills>hero.rec.best)hero.rec.best=G.kills;
        persist();
        seq(steps,function(){persist();if(G.list&&G.enc>=G.list.length)clearRun();else encounter()});
      }
    }else{
      if(btn)btn.classList.add('wrong');
      G.miss++;G.combo=0;G.retry.push(G.cur);G.missed[k]=1;
      hero.nig[k]=(hero.nig[k]||0)+2;
      var t='ざんねん！ '+(G.div?ans+' ÷ '+a+' ＝ '+b+' だよ。（'+a+' × '+b+' ＝ '+ans+'）':a+' × '+b+' ＝ '+ans+' だよ。')+yomi+'\n'+mname()+'の こうげき！ ';
      clearAnim(box);void box.offsetWidth;
      if(!hero.cfg.practice){
        var atp=G.m.at||'lunge';box.classList.add('is-atk-'+atp);
        if(atp==='shoot')$('fx').innerHTML='<div class="shot" style="color:'+(G.m.sc||'#ff6a2a')+'"></div>';
      }
      if(hero.cfg.practice){t+='れんしゅうモードなので ダメージは なし！';tune([330,262],.08)}
      else if(Math.random()*100<eqVal(1)){t+='しかし '+hero.name+'は たてで ふせいだ！';tune([440,660],.07);setTimeout(function(){fx('guard','ガード！')},220)}
      else if(hero.pal!=null&&!G.palUsed){G.palUsed=true;t+='なかまの '+MON[hero.pal].n+'が かばってくれた！';tune([440,554,660],.07);setTimeout(function(){fx('guard','かばった！')},220)}
      else{
        var atk=atkOf();G.heroHp-=atk;t+=hero.name+'は '+atk+'の ダメージを うけた！';setTimeout(function(){fx('hurt','−'+atk);$('app').classList.remove('quake','critq');void $('app').offsetWidth;$('app').classList.add('quake');tune([147,110],.12)},220);
      }
      status();
      var n=$('next');
      if(G.heroHp<=0){
        G.over=true;status();bgm(null);persist();
        say(t+'\n'+hero.name+'は ちからつきた…');
        later(gameOver,1800);
        return;
      }
      say(t);n.textContent='▶ つぎへ';n.onclick=ask;
      persist();
      n.classList.add('show');n.focus();
    }
  }
  function gameOver(){
    var keys=Object.keys(G.missed);
    $('overPic').innerHTML=heroPic();
    $('overMsg').textContent=hero.name+'は ちからつきた…\n'+(G.mode==='endless'?'きろく：'+G.kills+'たい たおした！（さいこう '+hero.rec.best+'たい）':G.label+'で '+G.kills+'たい たおした')+'\nけいけんちや そうびは そのまま のこるよ。';
    $('overMiss').innerHTML=keys.length?'<div class="small">つぎは ここを おぼえて いこう</div><div class="miss">'+keys.map(function(k){var p=kv(k);return '<span>'+p[0]+'×'+p[1]+'='+(p[0]*p[1])+'</span>'}).join('')+'</div>':'';
    $('over').classList.add('show');
    tune([392,370,349,330,311,294,0,196,196],.2);
    $('overRetry').onclick=function(){$('over').classList.remove('show');stopTimers();checkTitles();persist();if(again)again();else leave()};
    $('overBack').onclick=leave;
    $('overRetry').focus();
  }
  function clearRun(){
    G.over=true;
    $('mon').innerHTML='';clearChoices();drawMhp();status();bgm(null);
    if(!G.miss)hero.rec.perfect++;
    if(G.mode==='maou'){hero.rec.maou++;persist();ending();return}
    var t;
    if(G.mode==='weak')t='しゅぎょうを やりとげた！\nにがてな 九九は のこり '+count(hero.nig)+'こ。';
    else{var firstClear=!hero.cleared[G.id];countClear(G.id);hero.cleared[G.id]=true;t=G.label+'を クリアした！'+(G.id<=9?'\n'+G.id+'のだんを マスターだ！':'')+(firstClear&&G.id<=12?'\nおみせに あたらしい そうびが ならんだ！':'')}
    persist();
    say(t+(G.miss?'':'\nしかも ぜんもん せいかい！'));
    tune([523,0,523,587,659,0,784,1047],.11);
    var n=$('next');n.textContent='▶ もどる';n.onclick=leave;n.classList.add('show');
    if(G.id===14&&!hero.skins[RUSH_SKIN]){
      hero.skins[RUSH_SKIN]=1;persist();
      popup({head:'スキンを てにいれた！',icon:skinPic(RUSH_SKIN),name:SKINS[RUSH_SKIN].n,sub:'まおうの しろを せいはした あかし。\nプロフィールで きがえられるよ'},function(){n.focus()});
    }
  }
  function ending(){
    var fresh=checkTitles(),t=totals(hero);persist();
    tune([523,659,784,0,659,784,1047,0,784,1047,1319,1319],.14);
    page('おめでとう！','',
      '<div class="center" style="margin:8px 0">'+sprite(MAOU,'height:90px;opacity:.35')+'</div>'+
      '<div class="pre center">'+esc(hero.name)+'は まおうを たおした！\n\nダンジョンに へいわが もどった。\n九九の ちからで せかいを すくった\n'+esc(hero.name)+'は、\n九九の ゆうしゃと よばれるように なった。</div>'+
      '<div class="center gold" style="margin:14px 0">― おしまい ―</div>'+
      '<div class="small center">Lv '+hero.lv+'　こたえた かず '+(t[0]+t[1])+'もん\nずかん '+count(hero.seen)+'/'+MON.length+'　そうび '+count(hero.items)+'/'+ITEM_N+'</div>'+
      '<div class="center" style="margin-top:12px">でも ぼうけんは つづく。\n「たつじんへのみち」で うでだめしだ！</div>',
      function(){drawFloors(fresh);show('floors');bgm('menu')});
    $('pgBody').classList.add('pre');
    $('pgBack').addEventListener('click',function(){$('pgBody').classList.remove('pre')},{once:true});
  }
  function leave(){clearInterval(tiv);$('ghost').className='';$('pop').classList.remove('show');$('over').classList.remove('show');stopTimers();G.over=true;var fresh=checkTitles();persist();drawFloors(fresh);show('floors');bgm('menu')}
  $('run').onclick=leave;

  boot();
})();
</script>
